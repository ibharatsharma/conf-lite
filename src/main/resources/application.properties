spring.application.name=conflite

server.port=8080

# ------------------------------------------------------------
# SQLite
# ------------------------------------------------------------

spring.datasource.url=jdbc:sqlite:data/confluence.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite is file based; a small pool is sufficient.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ------------------------------------------------------------
# SQL schema initialization
# ------------------------------------------------------------

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ------------------------------------------------------------
# Spring Data JDBC
# ------------------------------------------------------------

spring.data.jdbc.repositories.enabled=true

# ------------------------------------------------------------
# jte
# ------------------------------------------------------------

gg.jte.templateLocation=src/main/jte
gg.jte.developmentMode=true
gg.jte.trimControlStructures=true
# Enable following in production to use precompiled templates. Precompiled templates are faster, but you need to recompile the project after changing a template.   
# gg.jte.usePrecompiledTemplates=true

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------

logging.level.com.example.confluencelite=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.data.jdbc=DEBUG